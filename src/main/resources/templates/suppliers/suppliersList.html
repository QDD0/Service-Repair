<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Поставщики</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">Поставщики</h1>
        <a href="suppliers/addSupplier" class="add-button">Добавить поставщика</a>
    </div>

    <div class="list-container">
        <a class="card"
           th:each="suppliers : ${suppliersList}"
           th:href="@{/suppliers/{id}(id=${suppliers.getSupplier_id()})}">
            <div class="card-name">
                <span th:text="${suppliers.name_company}"></span>
            </div>
            <div class="card-info">
                Контактное лицо: <span th:text="${suppliers.last_name + ' ' + suppliers.first_name + ' ' + suppliers.surname}"></span>
            </div>
            <div class="card-info">
                Телефон: <span th:text="${suppliers.phone}"></span>
            </div>
            <div class="card-info">
                Адрес: <span th:text="${suppliers.address}"></span>
            </div>
            <div class="card-info">
                Email: <span th:text="${suppliers.email}"></span>
            </div>
        </a>
    </div>

    <div class="pagination">
        <a th:if="${currentPage > 1}"
           th:href="@{/suppliers(page=${currentPage - 1}, size=5)}">Назад</a>

        <span th:text="'Страница ' + ${currentPage} + ' из ' + ${totalPages}"></span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/suppliers(page=${currentPage + 1}, size=5)}">Вперед</a>
    </div>
</div>
</body>
</html>
