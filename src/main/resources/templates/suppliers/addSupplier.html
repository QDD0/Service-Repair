<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Suppliers</title>
    <link rel="stylesheet" th:href="@{/css/addStyle.css}"/>
</head>
<body>
<div class="container">
    <h1 class="page-title">Добавление поставщика</h1>

    <form method="post" th:action="@{/suppliers}" th:object="${addSupplier}">
        <div class="form-group">
            <label for="name_company">Название компании:</label>
            <input type="text" th:field="*{name_company}" id="name_company" required>
        </div>

        <div class="form-group">
            <label for="first_name">Имя контакта:</label>
            <input type="text" th:field="*{first_name}" id="first_name" required>
        </div>

        <div class="form-group">
            <label for="surname">Фамилия контакта:</label>
            <input type="text" th:field="*{surname}" id="surname" required>
        </div>

        <div class="form-group">
            <label for="last_name">Отчество контакта:</label>
            <input type="text" th:field="*{last_name}" id="last_name">
        </div>

        <div class="form-group">
            <label for="phone">Телефон:</label>
            <input type="tel" th:field="*{phone}" id="phone" required>
        </div>

        <div class="form-group">
            <label for="address">Адрес:</label>
            <input type="text" th:field="*{address}" id="address" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" th:field="*{email}" id="email" required>
        </div>

        <button type="submit">Добавить поставщика</button>
    </form>

    <a th:href="@{/suppliers}" class="back-link">← Вернуться к списку поставщиков</a>
</div>
</body>
</html>
