<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:if="${services != null}">
    <span th:text="${services.name_service}">Name</span><br>
    <span th:text="${services.description}">Description</span><br>
    <span th:text="${services.price}">Price</span><br>
</div>

<a th:href="@{/services/{id}/edit(id=${services.id_service})}">Редактировать</a><br>
<form method="post" th:action="@{/services/{id}/delete(id=${services.id_service})}">
    <button type="submit">Удалить</button>
</form>
<a th:href="@{/services}">Вернуться назад</a><br>
</body>
</html>
