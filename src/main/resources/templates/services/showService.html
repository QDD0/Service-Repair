<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Details</title>
    <link rel="stylesheet" th:href="@{/css/showStyle.css}">
</head>
<body>
<div class="container">
    <h1>Информация об услуге</h1>

    <div class="details-container" th:if="${services != null}">
        <div class="detail-item">
            <span class="detail-label">Название:</span>
            <span class="detail-value" th:text="${services.name_service}">Service Name</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Описание:</span>
            <span class="detail-value" th:text="${services.description}">Description</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Цена:</span>
            <span class="detail-value" th:text="${services.price}">Price</span>
        </div>
    </div>

    <div class="actions">
        <a class="btn btn-edit" th:href="@{/services/{id}/edit(id=${services.id_service})}">Редактировать</a>

        <form class="form-delete" method="post" th:action="@{/services/{id}/delete(id=${services.id_service})}">
            <button class="btn btn-delete" type="submit" onclick="return confirm('Вы уверены, что хотите удалить эту услугу?')">Удалить</button>
        </form>

        <a class="btn btn-back" th:href="@{/services}">Вернуться назад</a>
    </div>
</div>
</body>
</html>
