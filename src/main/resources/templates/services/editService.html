<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать услугу</title>
    <link rel="stylesheet" th:href="@{/css/editStyle.css}">
</head>
<body>
<div class="container">
    <h1>Редактирование услуги</h1>
    <form method="post" th:action="@{/services/{id}/update(id=${services.id_service})}" th:object="${services}">
        <div class="form-group">
            <label for="name_service">Название услуги:</label>
            <input type="text" id="name_service" th:field="*{name_service}" required>
        </div>

        <div class="form-group">
            <label for="description">Описание:</label>
            <input type="text" id="description" th:field="*{description}">
        </div>

        <div class="form-group">
            <label for="price">Цена:</label>
            <input type="text" id="price" th:field="*{price}" required>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            <a th:href="@{/services}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
