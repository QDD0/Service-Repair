<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Услуги</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">Услуги</h1>
        <a href="services/addService" class="add-button">Добавить услугу</a>
    </div>

    <div class="list-container">
        <a class="card"
           th:each="services : ${servicesList}"
           th:href="@{/services/{id}(id=${services.getId_service()})}">
            <div class="card-name">
                <span th:text="${services.name_service}"></span>
            </div>
            <div class="card-info">
                Описание: <span th:text="${services.description}"></span>
            </div>
            <div class="card-info">
                Цена: <span th:text="${services.price}"></span>
            </div>
        </a>
    </div>

    <div class="pagination">
        <a th:if="${currentPage > 1}"
           th:href="@{/services(page=${currentPage - 1}, size=5)}">Назад</a>

        <span th:text="'Страница ' + ${currentPage} + ' из ' + ${totalPages}"></span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/services(page=${currentPage + 1}, size=5)}">Вперед</a>
    </div>
</div>
</body>
</html>
