<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Принятые устройства</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">Принятые устройства</h1>
        <a href="orders/addOrder" class="add-button">Добавить заказ</a>
    </div>

    <div class="list-container">
        <a class="card"
           th:each="order : ${ordersList}"
           th:href="@{/orders/{id}(id=${order.getOrder_id()})}">
            <div class="card-name">
                Серийный номер: <span th:text="${order.serial_number}"></span>
            </div>
            <div class="card-info">
                Проблема: <span th:text="${order.problem}"></span>
            </div>
            <div class="card-info">
                Дата приёма: <span th:text="${order.date_in}"></span>
            </div>
            <div class="card-info" th:if="${order.date_out}">
                Дата выдачи: <span th:text="${order.date_out}"></span>
            </div>
            <div class="card-info">
                Гарантия: <span th:text="${order.warranty ? 'Да' : 'Нет'}"></span>
            </div>
        </a>
    </div>

    <div class="pagination">
        <a th:if="${currentPage > 1}"
           th:href="@{/orders(page=${currentPage - 1}, size=5)}">Назад</a>

        <span th:text="'Страница ' + ${currentPage} + ' из ' + ${totalPages}"></span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/orders(page=${currentPage + 1}, size=5)}">Вперед</a>
    </div>
</div>
</body>
</html>
