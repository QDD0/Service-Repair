<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order</title>
    <link rel="stylesheet" th:href="@{/css/addStyle.css}"/>
</head>
<body>
<div class="container">
    <h1 class="page-title">Создание нового заказа</h1>

    <form method="post" th:action="@{/orders}" th:object="${addOrder}">
        <div class="form-group">
            <label for="serial_number">Серийный номер:</label>
            <input type="text" th:field="*{serial_number}" id="serial_number" placeholder="Введите серийный номер устройства" required>
        </div>

        <div class="form-group">
            <label for="problem">Описание проблемы:</label>
            <input type="text" th:field="*{problem}" id="problem" placeholder="Опишите проблему с устройством" required>
        </div>

        <div class="form-group">
            <label for="date_in">Дата приёма:</label>
            <input type="date" th:field="*{date_in}" id="date_in" required>
        </div>

        <div class="form-group">
            <label for="date_out">Дата выдачи:</label>
            <input type="date" th:field="*{date_out}" id="date_out">
        </div>

        <div class="form-group">
            <label for="warranty">Гарантия:</label>
            <input type="text" th:field="*{warranty}" id="warranty" placeholder="Например: 12 месяцев">
        </div>

        <div class="form-group">
            <label for="client">Выбор клиента:</label>
            <select id="client" name="client_id" required>
                <option value="">Выберите клиента</option>
                <option th:each="client : ${addClient}"
                        th:value="${client.client_id}"
                        th:text="${client.surname + ' ' + client.first_name + ' ' + client.last_name}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="device">Выбор устройства:</label>
            <select id="device" name="device_id" required>
                <option value="">Выберите устройство</option>
                <option th:each="device : ${addDevice}"
                        th:value="${device.device_id}"
                        th:text="${device.brand + ' ' + device.type}">
                </option>
            </select>
        </div>

        <button type="submit">Создать заказ</button>
    </form>

    <a th:href="@{/orders}" class="back-link">Вернуться к списку заказов</a>
</div>
</body>
</html>
