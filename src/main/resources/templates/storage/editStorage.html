<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование детали</title>
    <link rel="stylesheet" th:href="@{/css/editStyle.css}">
</head>
<body>
<div class="container">
    <h1>Редактирование детали</h1>

    <form method="post" th:action="@{/storage/{id}/update(id=${storage.part_id})}" th:object="${storage}">
        <input type="hidden" th:field="*{part_id}">

        <div class="form-group">
            <label for="part_name">Название детали:</label>
            <input type="text" id="part_name" th:field="*{part_name}" required>
        </div>

        <div class="form-group">
            <label for="part_code">Код детали:</label>
            <input type="text" id="part_code" th:field="*{part_code}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="price">Цена:</label>
                <input type="number" step="0.01" id="price" th:field="*{price}" min="0" required>
            </div>

            <div class="form-group">
                <label for="count">Количество:</label>
                <input type="number" id="count" th:field="*{count}" min="0" required>
            </div>
        </div>

        <div class="form-group">
            <label for="supplier">Поставщик:</label>
            <select id="supplier" name="supplier_id" required>
                <option value="">Выберите поставщика</option>
                <option th:each="supplier : ${supplier}"
                        th:value="${supplier.supplier_id}"
                        th:text="${supplier.name_company}"
                        th:selected="${storage.supplier_id == supplier.supplier_id}">
                </option>
            </select>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            <a th:href="@{/storage}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
