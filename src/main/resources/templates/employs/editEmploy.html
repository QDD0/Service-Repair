<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать сотрудника</title>
    <link rel="stylesheet" th:href="@{/css/editStyle.css}">
</head>
<body>
<div class="container">
    <h1>Редактирование сотрудника</h1>
    <form method="post" th:action="@{/employs/{id}/update(id=${employ.id_employ})}" th:object="${employ}">
        <div class="form-row">
            <div class="form-group">
                <label for="surname">Фамилия:</label>
                <input type="text" th:field="*{surname}" id="surname" required>
            </div>

            <div class="form-group">
                <label for="first_name">Имя:</label>
                <input type="text" th:field="*{first_name}" id="first_name" required>
            </div>
        </div>

        <div class="form-group">
            <label for="last_name">Отчество:</label>
            <input type="text" th:field="*{last_name}" id="last_name">
        </div>

        <div class="form-group">
            <label for="position">Должность:</label>
            <input type="text" th:field="*{position}" id="position" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="text" th:field="*{phone}" id="phone" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" th:field="*{email}" id="email">
            </div>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            <a th:href="@{/employs}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
