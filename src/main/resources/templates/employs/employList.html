<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сотрудники</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">Сотрудники</h1>
        <a class="add-button" th:href="@{/employs/addEmploy}">Добавить сотрудника</a>
    </div>

    <div class="list-container">
        <a class="card"
           th:each="employ : ${employList}"
           th:href="@{/employs/{id}(id=${employ.id_employ})}">

            <div class="card-name">
                <span th:text="${employ.surname + ' ' + employ.first_name + ' ' + employ.last_name}"></span>
            </div>

            <div class="card-info">
                Должность: <span th:text="${employ.position}"></span>
            </div>

            <div class="card-info">
                Телефон: <span th:text="${employ.phone}"></span>
            </div>

            <div class="card-info">
                Email: <span th:text="${employ.email}"></span>
            </div>

        </a>
    </div>

    <div class="pagination">
        <a th:if="${currentPage > 1}"
           th:href="@{/employs(page=${currentPage - 1}, size=5)}">Назад</a>

        <span>Страница<span th:text="${currentPage}"></span> из <span th:text="${totalPages}"></span></span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/employs(page=${currentPage + 1}, size=5)}">Вперед</a>
    </div>
</div>
</body>
</html>
