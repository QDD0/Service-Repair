<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div th:each="employ : ${employList}">
    <a th:href="@{/employs/{id}(id=${employ.getId_employ()})}">
        <span th:text="${employ.first_name}">First</span> <br>
        <span th:text="${employ.surname}">Sur</span><br>
        <span th:text="${employ.last_name}">Last</span><br>
        <span th:text="${employ.position}">Position</span><br>
        <span th:text="${employ.phone}">Phone</span><br>
        <span th:text="${employ.email}">Email</span><br>
    </a> <br>
</div>

<a th:href="@{/employs/}">Добавить</a>

<div>
    <a th:if="${currentPage > 1}"
       th:href="@{/employs(page=${currentPage - 1}, size = 5)}">Prev</a>

    <span th:text="${currentPage}"></span>
    <span th:text="${totalPages}"></span>

    <a th:if="${currentPage < totalPages}"
       th:href="@{/employs(page=${currentPage + 1}, sixe=5)}">Next</a>
</div>
</body>
</html>
