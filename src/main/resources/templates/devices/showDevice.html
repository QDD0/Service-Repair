<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Details</title>
    <link rel="stylesheet" th:href="@{/css/showStyle.css}">
</head>
<body>
<div class="container">
    <h1>Информация об устройстве</h1>

    <div class="details-container" th:if="${device != null}">
        <div class="detail-item">
            <span class="detail-label">Тип:</span>
            <span class="detail-value" th:text="${device.type}">Type</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Бренд:</span>
            <span class="detail-value" th:text="${device.brand}">Brand</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Модель:</span>
            <span class="detail-value" th:text="${device.model}">Model</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Описание:</span>
            <span class="detail-value" th:text="${device.description}">Description</span>
        </div>
    </div>

    <div class="actions">
        <a class="btn btn-edit" th:href="@{/devices/{id}/edit(id=${device.device_id})}">Редактировать</a>

        <form class="form-delete" method="post" th:action="@{/devices/{id}/delete(id=${device.device_id})}">
            <button class="btn btn-delete" type="submit" onclick="return confirm('Вы уверены, что хотите удалить это устройство?')">Удалить</button>
        </form>

        <a class="btn btn-back" th:href="@{/devices}">Вернуться назад</a>
    </div>
</div>
</body>
</html>
