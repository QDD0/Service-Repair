<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оборудование</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">Оборудование</h1>
        <a class="add-button" th:href="@{/devices/addDevice}">Добавить оборудование</a>
    </div>

    <div class="list-container">
        <a class="card"
           th:each="device : ${deviceList}"
           th:href="@{/devices/{id}(id=${device.device_id})}">

            <div class="card-name">
                <span th:text="${device.brand + ' ' + device.model}"></span>
            </div>
            <div class="card-info">
                Тип: <span th:text="${device.type}"></span>
            </div>
            <div class="card-info" th:if="${device.description}">
                Описание: <span th:text="${device.description}"></span>
            </div>

        </a>
    </div>

    <div class="pagination">
        <a th:if="${currentPage > 1}"
           th:href="@{/devices(page=${currentPage - 1}, size=5)}">Назад</a>

        <span>Страница<span th:text="${currentPage}"></span> из <span th:text="${totalPages}"></span></span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/devices(page=${currentPage + 1}, size=5)}">Вперед</a>
    </div>
</div>
</body>
</html>
