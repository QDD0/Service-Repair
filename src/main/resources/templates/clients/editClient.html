<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать клиента</title>
    <link rel="stylesheet" th:href="@{/css/editStyle.css}">
</head>
<body>
<div class="container">
    <h1>Редактирование клиента</h1>
    <form th:action="@{/clients/{id}/update(id=${client.client_id})}" method="post" th:object="${client}">
        <div class="form-row">
            <div class="form-group">
                <label for="surname">Фамилия:</label>
                <input type="text" id="surname" th:field="*{surname}" required>
            </div>

            <div class="form-group">
                <label for="first_name">Имя:</label>
                <input type="text" id="first_name" th:field="*{first_name}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="last_name">Отчество:</label>
            <input type="text" id="last_name" th:field="*{last_name}">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="text" id="phone" th:field="*{phone}" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}">
            </div>
        </div>

        <div class="form-group">
            <label for="address">Адрес:</label>
            <input type="text" id="address" th:field="*{address}">
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Обновить данные</button>
            <a href="/clients" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
