<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Клиенты</title>
    <link rel="stylesheet" th:href="@{/css/styleClient.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">Клиенты</h1>
        <a href="clients/addClient" class="add-button">Добавить клиента</a>
    </div>

    <div class="client-list">
        <div th:each="client : ${clientList}">
            <a th:href="@{/clients/{id}(id=${client.getClient_id()})}" class="client-card">
                <div class="client-name">
                    <span th:text="${client.last_name + ' ' + client.first_name + ' ' + client.surname}">ФИО клиента</span>
                </div>
                <div class="client-contact">
                    <span th:text="${client.phone}">Телефон</span>
                </div>
                <div class="client-contact">
                    <span th:text="${client.email}">Email</span>
                </div>
                <div class="client-contact">
                    <span th:text="${client.address}">Адрес</span>
                </div>
            </a>
        </div>
    </div>

    <div class="pagination">
        <a th:if="${currentPage > 1}"
           th:href="@{/clients(page=${currentPage - 1}, size=5)}">Назад</a>

        <span th:text="'Страница ' + ${currentPage} + ' из ' + ${totalPages}"></span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/clients(page=${currentPage + 1}, size=5)}">Вперед</a>
    </div>
</div>
</body>
</html>
