<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div th:each="client : ${clientList}">
    <a th:href="@{/clients/{id}(id=${client.getClient_id()})}">
        <div class="client-info">
            <span th:text="${client.first_name}">First:</span>
        </div>
        <div class="client-info">
            <span th:text="${client.surname}">First:</span>
        </div>
        <div class="client-info">
            <span th:text="${client.last_name}">First:</span>
        </div>
        <div class="client-info">
            <span th:text="${client.phone}">First:</span>
        </div>
        <div class="client-info">
            <span th:text="${client.email}">First:</span>
        </div>
        <div class="client-info">
            <span th:text="${client.address}">First:</span>
        </div>
    </a> <br>
</div>

<div>
    <a th:if="${currentPage > 1}"
       th:href="@{/clients(page=${currentPage - 1}, size=5)}">Prev</a>

    <span th:text="${currentPage}"></span>
    <span th:text="${totalPages}"></span>

    <a th:if="${currentPage < totalPages}"
       th:href="@{/clients(page=${currentPage + 1}, size=5)}">Next</a>
</div>

<a href="clients/addClient">Добавить клиента</a>
</body>
</html>
