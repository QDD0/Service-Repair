<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Details</title>
    <link rel="stylesheet" th:href="@{/css/showStyle.css}">
</head>
<body>
<div class="container">
    <h1>Информация о клиенте</h1>

    <div class="details-container" th:if="${client != null}">
        <div class="detail-item">
            <span class="detail-label">Имя:</span>
            <span class="detail-value" th:text="${client.first_name}">First Name</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Фамилия:</span>
            <span class="detail-value" th:text="${client.surname}">Surname</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Отчество:</span>
            <span class="detail-value" th:text="${client.last_name}">Last Name</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Телефон:</span>
            <span class="detail-value" th:text="${client.phone}">Phone</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Email:</span>
            <span class="detail-value" th:text="${client.email}">Email</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Адрес:</span>
            <span class="detail-value" th:text="${client.address}">Address</span>
        </div>
    </div>

    <div class="actions">
        <a class="btn btn-edit" th:href="@{/clients/{id}/edit(id=${client.client_id})}">Редактировать</a>

        <form class="form-delete" method="post" th:action="@{/clients/{id}/delete(id=${client.client_id})}">
            <button class="btn btn-delete" type="submit" onclick="return confirm('Вы уверены, что хотите удалить этого клиента?')">Удалить</button>
        </form>

        <a class="btn btn-back" th:href="@{/clients}">Вернуться назад</a>
    </div>
</div>
</body>
</html>
