<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Оплата</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">Оплата</h1>
        <a href="payments/addPayment" class="add-button">Добавить платёж</a>
    </div>

    <div class="list-container">
        <a class="card"
           th:each="payment : ${paymentsList}"
           th:href="@{/payments/{id}(id=${payment.getId_payment()})}">
            <div class="card-name">
                Платёж #<span th:text="${payment.getId_payment()}"></span>
            </div>
            <div class="card-info">
                Сумма: <span th:text="${payment.amount}"></span>
            </div>
            <div class="card-info">
                Дата оплаты: <span th:text="${payment.payment_date}"></span>
            </div>
            <div class="card-info">
                Способ оплаты: <span th:text="${payment.payment_method}"></span>
            </div>
        </a>
    </div>

    <div class="pagination">
        <a th:if="${currentPage > 1}"
           th:href="@{/payments(page=${currentPage - 1}, size=6)}">Назад</a>

        <span th:text="'Страница ' + ${currentPage} + ' из ' + ${totalPages}"></span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/payments(page=${currentPage + 1}, size=6)}">Вперед</a>
    </div>
</div>
</body>
</html>
