<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div class="sidenav">
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/devices}">Оборудование</a>
        <a th:href="@{/orders}">Принятые устройства</a>
        <a th:href="@{/storage}">Склад</a>
        <a th:href="@{/suppliers}">Поставщик</a>
        <a th:href="@{/employs}">Сотрудники</a>
        <a th:href="@{/services}">Услуги</a>
        <a th:href="@{/payments}">Оплата</a>
    </div>
</header>

<div th:each="payment : ${paymentsList}">
    <a th:href="@{/payments/{id}(id=${payment.getOrder_id()})}">
        <span th:text="${payment.amount}">amount</span><br>
        <span th:text="${payment.payment_date}">payment_date</span><br>
        <span th:text="${payment.payment_method}">payment_method</span><br>
    </a>
</div>
</body>
</html>
